<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YottaMail Ultimate Cloud</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent: #8e44ad;
            --bg: #ffffff;
            --surf: #f8f9fa;
            --border: #e9ecef;
            --text: #1a1a1a;
            --sec: #6c757d;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); color: var(--text); 
            overflow: hidden; 
        }

        /* --- UI COMPONENTS --- */
        .app-layer {
            position: fixed; inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .app-layer.active { display: flex; animation: app-entry 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes app-entry {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- HEADER --- */
        .glass-header {
            padding: 60px 25px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .header-title { font-size: 28px; font-weight: 900; letter-spacing: -1px; }

        /* --- BUTTONS & INPUTS --- */
        .y-input {
            width: 100%; padding: 20px;
            border-radius: 18px; border: 2px solid var(--border);
            background: var(--surf); font-size: 17px;
            margin-bottom: 15px; outline: none;
            transition: all 0.3s ease;
        }

        .y-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 15px rgba(142, 68, 173, 0.1); }

        .btn-prime {
            width: 100%; background: var(--accent);
            color: white; border: none; padding: 20px;
            border-radius: 20px; font-weight: 800;
            font-size: 18px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(142, 68, 173, 0.3);
            transition: transform 0.2s;
        }

        .btn-prime:active { transform: scale(0.96); }

        /* --- MAIL ITEMS --- */
        .mail-list { flex: 1; overflow-y: auto; padding: 20px 20px 120px; }

        .mail-card {
            background: white; padding: 20px;
            border-radius: 24px; margin-bottom: 15px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: slide-in 0.4s ease forwards;
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mail-card .sender { font-weight: 800; color: var(--accent); font-size: 14px; margin-bottom: 5px; display: block; }
        .mail-card .subject { font-weight: 700; font-size: 17px; margin-bottom: 8px; display: block; }
        .mail-card .preview { color: var(--sec); font-size: 14px; line-height: 1.5; }

        /* --- NAVIGATION TAB BAR --- */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px);
            display: flex; justify-content: space-around;
            padding: 15px 0 40px; border-top: 1px solid var(--border);
            z-index: 2000;
        }

        .tab-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 5px;
            color: var(--sec); font-size: 11px;
            font-weight: 700; cursor: pointer;
        }

        .tab-item.active { color: var(--accent); }

        /* --- FULLSCREEN LOADER --- */
        #cloud-loader {
            position: fixed; inset: 0;
            background: white; z-index: 99999;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid var(--surf);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- PROFILE --- */
        .profile-hero {
            background: var(--surf); padding: 40px 20px;
            border-radius: 30px; text-align: center; margin-bottom: 30px;
        }

        .avatar-large {
            width: 100px; height: 100px;
            background: var(--accent); color: white;
            border-radius: 50%; margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: 900;
        }
    </style>
</head>
<body>

    <div id="cloud-loader">
        <div class="spinner"></div>
        <p id="loader-text" style="margin-top:20px; font-weight:700; color:var(--accent);">Синхронизация с YottaMail Cloud...</p>
    </div>

    <div id="layer-welcome" class="app-layer active" style="justify-content:center; align-items:center; padding:40px; text-align:center;">
        <div style="width:100px; height:100px; background:var(--accent); border-radius:30px; display:flex; align-items:center; justify-content:center; color:white; margin-bottom:30px;">
            <i data-lucide="mail" size="50"></i>
        </div>
        <h1 style="font-size:48px; font-weight:900; margin:0; letter-spacing:-2px;">YottaMail</h1>
        <p style="color:var(--sec); font-size:18px; margin-top:10px; margin-bottom:60px;">Мощная облачная почта для тебя.</p>
        <button class="btn-prime" onclick="App.show('layer-reg')">Начать работу</button>
        <button onclick="App.show('layer-login')" style="margin-top:25px; background:none; border:none; color:var(--accent); font-weight:800; font-size:16px;">Уже есть аккаунт?</button>
    </div>

    <div id="layer-reg" class="app-layer" style="padding:80px 25px;">
        <div onclick="App.show('layer-welcome')" style="margin-bottom:30px;"><i data-lucide="arrow-left"></i></div>
        <h2 class="header-title">Регистрация</h2>
        <p class="desc" style="margin-bottom:40px;">Создайте свой уникальный @ymail адрес в облаке.</p>
        <input type="text" id="reg-name" class="y-input" placeholder="Ваше имя">
        <input type="text" id="reg-login" class="y-input" placeholder="логин (без @ymail.com)">
        <input type="password" id="reg-pin" class="y-input" placeholder="ПИН-код (4 цифры)" maxlength="4">
        <div style="margin-top:auto">
            <button class="btn-prime" onclick="App.cloudRegister()">Создать аккаунт</button>
        </div>
    </div>

    <div id="layer-login" class="app-layer" style="padding:80px 25px;">
        <div onclick="App.show('layer-welcome')" style="margin-bottom:30px;"><i data-lucide="arrow-left"></i></div>
        <h2 class="header-title">Вход</h2>
        <p class="desc" style="margin-bottom:40px;">Введите данные для синхронизации.</p>
        <input type="text" id="log-login" class="y-input" placeholder="логин@ymail.com">
        <input type="password" id="log-pin" class="y-input" placeholder="Ваш ПИН-код">
        <div style="margin-top:auto">
            <button class="btn-prime" onclick="App.cloudLogin()">Войти в облако</button>
        </div>
    </div>

    <div id="layer-app" class="app-layer">
        <header class="glass-header">
            <h1 id="view-title" class="header-title">Входящие</h1>
            <div id="user-badge" onclick="App.nav('profile')" style="width:40px; height:40px; background:var(--accent); border-radius:12px; display:flex; align-items:center; justify-content:center; color:white; font-weight:900;">U</div>
        </header>

        <div id="mail-view" class="mail-list">
            </div>

        <div id="profile-view" class="mail-list" style="display:none;">
            <div class="profile-hero">
                <div id="p-avatar" class="avatar-large">?</div>
                <h2 id="p-name">Загрузка...</h2>
                <p id="p-mail" style="color:var(--accent); font-weight:700;"></p>
            </div>
            <button class="y-input" style="color:red; font-weight:700; text-align:center;" onclick="App.logout()">Выйти из системы</button>
        </div>

        <nav class="tab-bar">
            <div class="tab-item active" id="tab-inbox" onclick="App.nav('inbox')"><i data-lucide="inbox"></i><span>Почта</span></div>
            <div class="tab-item" onclick="App.syncMails()"><i data-lucide="refresh-cw"></i><span>Обновить</span></div>
            <div class="tab-item" onclick="App.nav('profile')"><i data-lucide="user"></i><span>Профиль</span></div>
        </nav>

        <button onclick="App.openCompose()" style="position:fixed; bottom:120px; right:25px; width:65px; height:65px; background:var(--accent); color:white; border-radius:20px; border:none; box-shadow:0 10px 30px rgba(142,68,173,0.4); display:flex; align-items:center; justify-content:center; z-index:3000;">
            <i data-lucide="plus" size="30"></i>
        </button>
    </div>

    <div id="layer-compose" class="app-layer" style="z-index:5000;">
        <header class="glass-header">
            <span onclick="App.closeCompose()" style="font-weight:700; color:var(--sec)">Отмена</span>
            <button onclick="App.sendMail()" style="background:var(--accent); color:white; border:none; padding:10px 25px; border-radius:15px; font-weight:800;">Отправить</button>
        </header>
        <div style="padding:20px;">
            <input type="text" id="m-to" class="y-input" placeholder="Кому:" style="border:none; border-bottom:1px solid var(--border); border-radius:0; background:none;">
            <input type="text" id="m-sub" class="y-input" placeholder="Тема:" style="border:none; border-bottom:1px solid var(--border); border-radius:0; background:none;">
            <textarea id="m-body" style="width:100%; height:400px; border:none; font-size:18px; outline:none; padding:20px 0; background:none;" placeholder="Начните писать..."></textarea>
        </div>
    </div>

    <script>
        /**
         * YottaMail OS - Core Engine
         * Архитектура: Cloud Synchronized
         */
        const App = {
            config: {
                botToken: '7713001698:AAH-Q1UMyt-tgQKugre5jrjxrflC_PIXKAk',
                dbChatId: '-1002263155355',
                mailChatId: '@YottaMail'
            },
            user: JSON.parse(localStorage.getItem('yotta_user')) || null,

            // Показать слой
            show: function(id) {
                document.querySelectorAll('.app-layer').forEach(l => l.classList.remove('active'));
                const target = document.getElementById(id);
                if(target) target.classList.add('active');
                lucide.createIcons();
            },

            // Переключение вкладок
            nav: function(tab) {
                const mailView = document.getElementById('mail-view');
                const profileView = document.getElementById('profile-view');
                const title = document.getElementById('view-title');
                
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));

                if(tab === 'inbox') {
                    mailView.style.display = 'block';
                    profileView.style.display = 'none';
                    title.innerText = 'Входящие';
                    document.getElementById('tab-inbox').classList.add('active');
                } else if(tab === 'profile') {
                    mailView.style.display = 'none';
                    profileView.style.display = 'block';
                    title.innerText = 'Профиль';
                    this.renderProfile();
                }
                lucide.createIcons();
            },

            // Облачная регистрация
            cloudRegister: async function() {
                const name = document.getElementById('reg-name').value;
                const login = document.getElementById('reg-login').value;
                const pin = document.getElementById('reg-pin').value;

                if(!name || !login || !pin) return alert('Заполните все поля!');

                this.toggleLoader(true, 'Создаем облачный профиль...');
                
                const mail = login.includes('@') ? login : login + '@ymail.com';
                const dbEntry = `USER_DATA|${mail}|${pin}|${name}`;

                try {
                    await fetch(`https://api.telegram.org/bot${this.config.botToken}/sendMessage?chat_id=${this.config.dbChatId}&text=${encodeURIComponent(dbEntry)}`);
                    
                    this.user = { name, mail, pin };
                    localStorage.setItem('yotta_user', JSON.stringify(this.user));
                    
                    this.toggleLoader(false);
                    this.show('layer-app');
                    this.syncMails();
                } catch(e) {
                    alert('Ошибка сети. Попробуйте снова.');
                    this.toggleLoader(false);
                }
            },

            // Облачный вход (Поиск в истории @cyberpacer)
            cloudLogin: async function() {
                const login = document.getElementById('log-login').value;
                const pin = document.getElementById('log-pin').value;

                if(!login || !pin) return alert('Введите данные!');

                this.toggleLoader(true, 'Ищем аккаунт в базе...');

                try {
                    const response = await fetch(`https://api.telegram.org/bot${this.config.botToken}/getUpdates?offset=-50`);
                    const data = await response.json();
                    
                    // Ищем в последних сообщениях канала
                    const match = data.result.find(m => {
                        const text = m.channel_post ? m.channel_post.text : '';
                        return text.includes(`USER_DATA|${login}|${pin}`);
                    });

                    if(match) {
                        const parts = match.channel_post.text.split('|');
                        this.user = { mail: parts[1], pin: parts[2], name: parts[3] };
                        localStorage.setItem('yotta_user', JSON.stringify(this.user));
                        this.show('layer-app');
                        this.syncMails();
                    } else {
                        alert('Аккаунт не найден или ПИН неверен. Проверьте @cyberpacer.');
                    }
                } catch(e) {
                    alert('Ошибка подключения к облаку.');
                }
                this.toggleLoader(false);
            },

            // Синхронизация писем из @YottaMail (Берет всё доступное)
            syncMails: async function() {
                const list = document.getElementById('mail-view');
                list.innerHTML = '<p style="text-align:center; padding:50px; opacity:0.5;">Синхронизация с каналом @YottaMail...</p>';

                try {
                    // Используем offset=-100 чтобы взять максимум сообщений
                    const response = await fetch(`https://api.telegram.org/bot${this.config.botToken}/getUpdates?offset=-100&limit=100`);
                    const data = await response.json();
                    
                    // Фильтруем сообщения именно из канала YottaMail
                    const mails = data.result.filter(m => m.channel_post && m.channel_post.chat.title === "YottaMail");

                    list.innerHTML = '';
                    if(mails.length === 0) {
                        list.innerHTML = '<div style="text-align:center; padding:100px 20px; opacity:0.3;"><i data-lucide="mail-search" size="64"></i><p>Писем пока нет. Отправьте первое!</p></div>';
                    } else {
                        mails.reverse().forEach(m => {
                            const raw = m.channel_post.text || "Пустое сообщение";
                            list.innerHTML += `
                                <div class="mail-card">
                                    <span class="sender">YottaCloud System</span>
                                    <span class="subject">Входящее сообщение</span>
                                    <p class="preview">${raw}</p>
                                </div>
                            `;
                        });
                    }
                } catch(e) {
                    list.innerHTML = '<p style="text-align:center; color:red; padding:50px;">Ошибка связи с сервером.</p>';
                }
                lucide.createIcons();
            },

            // Отправка письма
            sendMail: async function() {
                const to = document.getElementById('m-to').value;
                const sub = document.getElementById('m-sub').value;
                const body = document.getElementById('m-body').value;

                if(!to || !body) return alert('Укажите получателя и текст!');

                this.toggleLoader(true, 'Шифрование и отправка...');
                
                const fullMsg = `📩 НОВОЕ ПИСЬМО\nОт: ${this.user.mail}\nКому: ${to}\nТема: ${sub}\n\n${body}`;

                try {
                    await fetch(`https://api.telegram.org/bot${this.config.botToken}/sendMessage?chat_id=${this.config.mailChatId}&text=${encodeURIComponent(fullMsg)}`);
                    this.closeCompose();
                    this.syncMails();
                } catch(e) {
                    alert('Не удалось отправить письмо.');
                }
                this.toggleLoader(false);
            },

            renderProfile: function() {
                if(!this.user) return;
                document.getElementById('p-name').innerText = this.user.name;
                document.getElementById('p-mail').innerText = this.user.mail;
                document.getElementById('p-avatar').innerText = this.user.name[0];
                document.getElementById('user-badge').innerText = this.user.name[0];
            },

            openCompose: function() { document.getElementById('layer-compose').classList.add('active'); },
            closeCompose: function() { document.getElementById('layer-compose').classList.remove('active'); },
            
            toggleLoader: function(show, text) {
                const l = document.getElementById('cloud-loader');
                document.getElementById('loader-text').innerText = text || 'Загрузка...';
                l.style.display = show ? 'flex' : 'none';
            },

            logout: function() {
                localStorage.removeItem('yotta_user');
                location.reload();
            }
        };

        // Запуск системы
        window.onload = () => {
            if(App.user) {
                App.show('layer-app');
                App.renderProfile();
                App.syncMails();
            }
            lucide.createIcons();
        };
    </script>
</body>
</html>
