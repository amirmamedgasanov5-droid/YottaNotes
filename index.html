<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Yotta Notes</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YottaNotes">
    <meta name="theme-color" content="#8a3ffc">

    <link rel="icon" type="image/png" href="https://i.ibb.co/vxS8m6m/ZpL5srbv.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/vxS8m6m/ZpL5srbv.png">

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        
        
        :root {
            --bg: #ffffff; --surf: #f2f2f7; --card: #ffffff; --text: #000000;
            --accent: #007aff; --sec: #8e8e93; --radius: 32px; --border: rgba(0,0,0,0.06);
            --blur: saturate(180%) blur(20px);
        }
        .ghost-mode {
            --bg: #000000; --surf: #1c1c1e; --card: #2c2c2e; --text: #ffffff;
            --accent: #bf94ff; --sec: #48484a; --border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* --- AUTH SCREEN --- */
        #auth-gate {
            position: fixed; inset: 0; background: var(--bg); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .gate-logo {
            width: 100px; height: 100px; background: var(--accent);
            border-radius: 30px; display: flex; align-items: center; justify-content: center;
            color: white; box-shadow: 0 20px 40px rgba(0,122,255,0.2);
            cursor: pointer; transition: 0.3s;
        }
        .gate-logo:active { transform: scale(0.9); }

        /* --- APP LAYOUT --- */
        .app-shell { position: relative; height: 100vh; display: flex; flex-direction: column; }
        
        header { 
            padding: 60px 25px 20px; 
            background: rgba(var(--bg), 0.7); backdrop-filter: var(--blur);
            z-index: 100;
        }
        .h-wrap { display: flex; justify-content: space-between; align-items: center; }
        .h-title { 
            font-size: 34px; font-weight: 900; margin: 0; letter-spacing: -1px;
            cursor: pointer; user-select: none;
        }

        .main-scroll { 
            flex: 1; overflow-y: auto; padding: 10px 20px 150px; 
            scroll-behavior: smooth;
        }

        /* --- CARDS & ITEMS --- */
        .section-label { 
            font-size: 13px; font-weight: 800; text-transform: uppercase; 
            color: var(--sec); margin: 25px 0 15px 5px; letter-spacing: 1px;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .n-card {
            background: var(--card); border-radius: var(--radius); padding: 20px;
            border: 1px solid var(--border); position: relative;
            min-height: 160px; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            animation: slideUp 0.5s ease forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .n-card h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
        .n-card p { font-size: 13px; color: var(--sec); margin-top: 8px; flex: 1; }
        .n-tools { display: flex; gap: 12px; margin-top: 15px; color: var(--sec); }
        .n-tools i:hover { color: var(--accent); }

        .t-item {
            background: var(--surf); padding: 20px; border-radius: 22px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 15px;
            border: 1px solid var(--border);
        }
        .t-item.done { opacity: 0.4; filter: grayscale(1); }
        .t-check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; }
        .t-check.active { background: var(--accent); color: white; }

        /* --- EDITOR SYSTEM --- */
        #editor-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 5000;
            display: none; flex-direction: column; animation: fullUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fullUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .ed-head { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }
        .ed-body { flex: 1; padding: 0 25px; display: flex; flex-direction: column; }
        .ed-title { font-size: 32px; font-weight: 900; border: none; background: transparent; color: var(--text); padding: 10px 0; }
        .ed-text { flex: 1; font-size: 19px; border: none; background: transparent; color: var(--text); resize: none; line-height: 1.6; }

        .type-pill {
            display: flex; background: var(--surf); padding: 5px; border-radius: 15px; margin: 20px 0;
        }
        .pill { flex: 1; padding: 12px; text-align: center; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .pill.active { background: var(--accent); color: white; }

        /* --- NAV & TAB BAR --- */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(var(--bg), 0.8); backdrop-filter: var(--blur);
            padding: 15px 10px 40px; display: flex; justify-content: space-around;
            border-top: 1px solid var(--border); z-index: 4000;
        }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--sec); font-size: 11px; font-weight: 700; }
        .nav-tab.active { color: var(--accent); }

        .fab {
            position: fixed; bottom: 120px; right: 25px;
            width: 70px; height: 70px; background: var(--accent);
            color: white; border-radius: 24px; border: none;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(0,122,255,0.3); z-index: 4500;
        }

        /* --- TOAST --- */
        #toast {
            position: fixed; bottom: 110px; left: 20px; right: 20px;
            background: #1c1c1e; color: white; padding: 18px 25px;
            border-radius: 20px; display: none; justify-content: space-between;
            align-items: center; z-index: 9999;
        }
    </style>
</head>
<body class="light-theme">

    <div id="auth-gate">
        <div class="gate-logo" id="gate-trigger">
            <i data-lucide="fingerprint" size="40"></i>
        </div>
        <h1 style="margin-top: 25px; font-weight: 900; letter-spacing: -1px;">Yotta notes</h1>
        <p style="color: var(--sec); font-weight: 500;">«Если вы уже создавали профиль ранее,<br>просто нажмите кнопку ниже для входа».</p>
        <div style="margin-top: 40px;">
            <input type="text" id="user-name-input" placeholder="Ваше имя" style="background:var(--surf); border:none; padding:15px 25px; border-radius:15px; text-align:center;">
            <button onclick="unlockApp()" style="display:block; width:100%; margin-top:10px; padding:15px; border-radius:15px; border:none; background:var(--accent); color:white; font-weight:800;">Войти</button>
        </div>
    </div>

    <div class="app-shell">
        <header>
            <div class="h-wrap">
                <h1 class="h-title" id="app-title">Заметки</h1>
                <div id="user-avatar" style="width:45px; height:45px; background:var(--surf); border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:800;">U</div>
            </div>
        </header>

        <main class="main-scroll" id="main-content">
            </main>

        <button class="fab" onclick="Editor.open()">
            <i data-lucide="plus" size="34"></i>
        </button>

        <nav class="nav-bar">
            <div class="nav-tab active" onclick="Nav.go('notes', this)"><i data-lucide="layout-grid"></i><span>Заметки</span></div>
            <div class="nav-tab" onclick="Nav.go('tasks', this)"><i data-lucide="check-square"></i><span>Задачи</span></div>
            <div class="nav-tab" onclick="Nav.go('archive', this)"><i data-lucide="archive"></i><span>Архив</span></div>
            <div class="nav-tab" onclick="Nav.go('settings', this)"><i data-lucide="settings"></i><span>Профиль</span></div>
        </nav>
    </div>

    <div id="editor-overlay">
        <div class="ed-head">
            <span onclick="Editor.close()" style="font-weight:700; color:var(--sec)">Отмена</span>
            <div id="save-indicator" style="font-size:12px; color:var(--accent); font-weight:800; opacity:0;">СОХРАНЕНО</div>
            <button onclick="Editor.finalize()" style="background:var(--accent); color:white; border:none; padding:10px 25px; border-radius:16px; font-weight:800;">Готово</button>
        </div>
        <div class="ed-body">
            <div class="type-pill">
                <div class="pill active" id="pill-note" onclick="Editor.setType('note')">Заметка</div>
                <div class="pill" id="pill-task" onclick="Editor.setType('task')">Задача</div>
            </div>
            <input type="text" id="ed-t" class="ed-title" placeholder="Заголовок">
            <textarea id="ed-c" class="ed-text" placeholder="Начните писать здесь..."></textarea>
        </div>
    </div>

    <div id="toast">
        <span id="toast-msg">Запись удалена</span>
        <button onclick="Data.undo()" style="background:none; border:none; color:var(--accent); font-weight:800;">ОТМЕНИТЬ</button>
    </div>

    <script>
        // --- CORE DATA ENGINE ---
        const Data = {
            notes: JSON.parse(localStorage.getItem('ultra_notes')) || [],
            phantom: JSON.parse(localStorage.getItem('ultra_phantom')) || [],
            user: JSON.parse(localStorage.getItem('ultra_user')) || { name: 'Студент' },
            isPhantom: false,
            temp: null,

            save() {
                localStorage.setItem(this.isPhantom ? 'ultra_phantom' : 'ultra_notes', JSON.stringify(this.isPhantom ? this.phantom : this.notes));
                Render.all();
            },

            add(item) {
                if(this.isPhantom) this.phantom.unshift(item);
                else this.notes.unshift(item);
                this.save();
            },

            delete(id) {
                const db = this.isPhantom ? this.phantom : this.notes;
                this.temp = { data: db.find(x => x.id === id), index: db.findIndex(x => x.id === id) };
                if(this.isPhantom) this.phantom = this.phantom.filter(x => x.id !== id);
                else this.notes = this.notes.filter(x => x.id !== id);
                this.save();
                UI.showToast();
            },

            undo() {
                if(!this.temp) return;
                const db = this.isPhantom ? this.phantom : this.notes;
                db.splice(this.temp.index, 0, this.temp.data);
                this.temp = null;
                this.save();
                document.getElementById('toast').style.display = 'none';
            }
        };

        // --- NAVIGATION & UI ---
        const Nav = {
            current: 'notes',
            go(page, el) {
                this.current = page;
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                if(el) el.classList.add('active');
                Render.all();
            }
        };

        const UI = {
            togglePhantom() {
                Data.isPhantom = !Data.isPhantom;
                document.body.classList.toggle('ghost-mode');
                document.getElementById('app-title').innerText = Data.isPhantom ? 'Phantom OS' : 'Заметки';
                UI.playFeedback(Data.isPhantom ? 150 : 440);
                Render.all();
            },

            playFeedback(freq) {
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.connect(g); g.connect(ctx.destination);
                osc.frequency.value = freq;
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            },

            showToast() {
                const t = document.getElementById('toast');
                t.style.display = 'flex';
                setTimeout(() => t.style.display = 'none', 4000);
            }
        };

        // --- EDITOR & AUTOSAVE ---
        const Editor = {
            type: 'note',
            activeId: null,

            open(id = null) {
                this.activeId = id;
                const overlay = document.getElementById('editor-overlay');
                overlay.style.display = 'flex';
                
                // Проверка черновика или существующей заметки
                const draft = JSON.parse(localStorage.getItem('ultra_draft'));
                if(draft) {
                    document.getElementById('ed-t').value = draft.t;
                    document.getElementById('ed-c').value = draft.c;
                    this.setType(draft.type);
                }
            },

            setType(t) {
                this.type = t;
                document.getElementById('pill-note').classList.toggle('active', t === 'note');
                document.getElementById('pill-task').classList.toggle('active', t === 'task');
            },

            close() {
                document.getElementById('editor-overlay').style.display = 'none';
                localStorage.removeItem('ultra_draft');
                document.getElementById('ed-t').value = '';
                document.getElementById('ed-c').value = '';
            },

            finalize() {
                const t = document.getElementById('ed-t').value || 'Без заголовка';
                const c = document.getElementById('ed-c').value;
                if(!c) return this.close();

                Data.add({ id: Date.now(), t, c, type: this.type, date: new Date().toLocaleDateString(), done: false, status: 'active' });
                this.close();
            }
        };

        // Autosave Listener
        document.getElementById('ed-t').addEventListener('input', runAutoSave);
        document.getElementById('ed-c').addEventListener('input', runAutoSave);

        function runAutoSave() {
            const draft = {
                t: document.getElementById('ed-t').value,
                c: document.getElementById('ed-c').value,
                type: Editor.type
            };
            localStorage.setItem('ultra_draft', JSON.stringify(draft));
            const ind = document.getElementById('save-indicator');
            ind.style.opacity = '1';
            setTimeout(() => ind.style.opacity = '0', 800);
        }

        // --- RENDER ENGINE ---
        const Render = {
            all() {
                const container = document.getElementById('main-content');
                const db = Data.isPhantom ? Data.phantom : Data.notes;
                container.innerHTML = '';

                if(Nav.current === 'notes') {
                    const items = db.filter(x => x.type === 'note' && x.status === 'active');
                    container.innerHTML = `<div class="section-label">Ваши записи</div>`;
                    if(!items.length) container.innerHTML += '<p style="opacity:0.3; text-align:center; padding:40px;">Нет заметок</p>';
                    const grid = document.createElement('div'); grid.className = 'grid';
                    items.forEach(n => {
                        grid.innerHTML += `
                            <div class="n-card">
                                <h3>${n.t}</h3>
                                <p>${n.c.substring(0,60)}...</p>
                                <div class="n-tools">
                                    <i data-lucide="archive" size="18" onclick="Render.move(${n.id}, 'archive')"></i>
                                    <i data-lucide="trash-2" size="18" onclick="Data.delete(${n.id})"></i>
                                </div>
                            </div>
                        `;
                    });
                    container.appendChild(grid);
                }

                if(Nav.current === 'tasks') {
                    const items = db.filter(x => x.type === 'task' && x.status === 'active');
                    container.innerHTML = `<div class="section-label">Список дел</div>`;
                    items.forEach(t => {
                        container.innerHTML += `
                            <div class="t-item ${t.done?'done':''}" onclick="Render.toggleTask(${t.id})">
                                <div class="t-check ${t.done?'active':''}">${t.done?'✓':''}</div>
                                <div style="flex:1; font-weight:700;">${t.t}</div>
                                <i data-lucide="trash-2" size="18" onclick="Data.delete(${t.id})"></i>
                            </div>
                        `;
                    });
                }

                if(Nav.current === 'archive') {
                    const items = db.filter(x => x.status === 'archive');
                    container.innerHTML = `<div class="section-label">Архив</div><div class="grid">`;
                    items.forEach(n => {
                        container.innerHTML += `<div class="n-card"><h3>${n.t}</h3><i data-lucide="rotate-ccw" onclick="Render.move(${n.id}, 'active')"></i></div>`;
                    });
                    container.innerHTML += `</div>`;
                }

                if(Nav.current === 'settings') {
                    container.innerHTML = `
                        <div style="background:var(--surf); padding:40px 20px; border-radius:30px; text-align:center; margin-top:20px;">
                            <div style="width:80px; height:80px; background:var(--accent); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:30px; font-weight:900;">${Data.user.name[0]}</div>
                            <h2>${Data.user.name}</h2>
                            <p style="color:var(--sec)">Yotta notes</p>
                            <button onclick="localStorage.clear(); location.reload();" style="color:red; background:none; border:none; font-weight:700; margin-top:30px;">Сбросить систему</button>
                        </div>
                    `;
                }
                lucide.createIcons();
            },

            move(id, status) {
                const db = Data.isPhantom ? Data.phantom : Data.notes;
                const idx = db.findIndex(x => x.id === id);
                db[idx].status = status;
                Data.save();
            },

            toggleTask(id) {
                const db = Data.isPhantom ? Data.phantom : Data.notes;
                const idx = db.findIndex(x => x.id === id);
                db[idx].done = !db[idx].done;
                UI.playFeedback(600);
                Data.save();
            }
        };

        // --- GESTURES & INIT ---
        function unlockApp() {
            const name = document.getElementById('user-name-input').value;
            if(name) { Data.user.name = name; localStorage.setItem('ultra_user', JSON.stringify(Data.user)); }
            document.getElementById('auth-gate').style.transform = 'translateY(-100%)';
            document.getElementById('user-avatar').innerText = Data.user.name[0];
            Render.all();
        }

        const setupTrigger = (id) => {
            const el = document.getElementById(id);
            let timer;
            el.addEventListener('mousedown', () => timer = setTimeout(UI.togglePhantom, 1500));
            el.addEventListener('touchstart', () => timer = setTimeout(UI.togglePhantom, 1500));
            el.addEventListener('mouseup', ()=> clearTimeout(timer));
            el.addEventListener('touchend', () => clearTimeout(timer));
        };

        setupTrigger('gate-trigger');
        setupTrigger('app-title');

        window.onload = () => {
            if(localStorage.getItem('ultra_user')) {
                // Если пользователь уже заходил, можно сразу просить только "жест"
                document.getElementById('user-name-input').style.display = 'none';
            }
            lucide.createIcons();
        };
    </script>
</body>
</html>
