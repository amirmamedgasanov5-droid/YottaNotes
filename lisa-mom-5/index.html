<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сообщение от мамы — серия 5</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;overflow:hidden;background:#000}
  svg{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:"Trebuchet MS","DejaVu Sans","Segoe UI",system-ui,sans-serif}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice"></svg></div>
<script src="../shared/engine.js"></script>
<script>
E.TOTAL = 120;
const Y = 338;

/* ---------- scenes ---------- */
const flat = E.scene(4.6, 24.5, g => E.flat(g));
flat.doorOpen(20.4, 24.5);
const s5 = E.scene(24.5, 31.5, g => E.stairs(g, '5'));
const s3 = E.scene(31.5, 39.0, g => E.stairs(g, '3'));
const s2 = E.scene(39.0, 62.0, g => E.stairs(g, '2'));
const bas = E.scene(62.0, 117.0, g => E.basement(g));
[s5, s3, s2].forEach((s, i) => E.flicker(s.bulb, 1, 11 + i));
E.flicker(bas.bulb, .9, 21, 90);
// cover the original box once it is taken out of the cage
E.raw(bas.g, '<rect x="166" y="288" width="72" height="52" fill="#2b2e33"/>'); E.vis(bas.g.lastElementChild, [[74.2, 117]]);

/* ---------- actors ---------- */
const lisa = E.Lisa(E.layers.actors), mom = E.Mom(E.layers.actors), valya = E.Valya(E.layers.actors), thing = E.Thing(E.layers.actors);
E.at(lisa, [[0, 72, Y], [20.4, 72], [24.2, 335], [24.3, 430], [24.4, 430], [24.6, 225], [25.6, 225], [31.2, 60], [31.4, 430], [31.7, 400], [34.5, 215], [35.5, 215], [38.9, 70], [39.0, 420], [41.5, 285], [61.6, 285], [61.8, 430], [62.0, 430], [65, 135], [90, 135], [92, 60], [117, 60]]);
E.at(mom, [[0, 200, Y], [20.4, 200], [22.6, 335], [24.2, 430], [24.4, 430], [24.6, 262], [25.8, 262], [31.2, 95], [31.4, 450], [31.7, 440], [34.8, 250], [35.5, 250], [38.9, 100], [39.0, 450], [41.8, 322], [61.6, 322], [61.8, 450], [62.0, 450], [65.2, 175], [90, 178], [92, 95], [117, 95]]);
E.at(valya, [[0, 292, Y], [117, 292, Y]]);
E.vis(valya.g, [[4.6, 24.4]]);
E.vis(lisa.g, [[0, 117]]); E.vis(mom.g, [[0, 117]]);

E.face(lisa, [[0, 14.5, 'worry', 0], [14.5, 31.5, 'scared', -1], [31.5, 39, 'scared', 0], [39, 56.5, 'scared', -1], [56.5, 62, 'shock', -1], [62, 86.5, 'worry', 0], [86.5, 90, 'worry', 1], [90, 109, 'scared', 1], [109, 117, 'shock', 0]]);
E.face(mom, [[0, 20.4, 'grim', 0], [20.4, 56.5, 'worry', -1], [56.5, 62, 'scared', -1], [62, 90, 'grim', 0], [90, 117, 'scared', 1]]);
E.face(valya, [[4.6, 24.5, 'worry', 0]]);

// the echo: a tall silhouette that comes up from below, stops, listens and leaves
E.at(thing, [[0, -80, 352, 1.25], [44, -80], [56, 250], [59, 250], [61.5, 215, 330, .55], [62, 215, 328, .5], [108, 350, 338, 1.2], [116.9, 262, 338, 1.2]]);
E.opacity(thing.g, [[0, 0], [43.99, 0], [44, 1], [61.9, 1], [62, 0], [107.99, 0], [108, .0], [111, .55], [117, .65]]);

// two white eyes coming down the basement stairs (right side) in the dark
const eyes = E.G(E.layers.actors); E.raw(eyes, '<ellipse cx="-6" cy="0" rx="3.2" ry="4.6" fill="#fff"/><ellipse cx="6" cy="0" rx="3.2" ry="4.6" fill="#fff"/>');
E.move(eyes, [[0, 350, 230, .8], [95, 350, 230, .8], [110, 276, 246, 1.7], [117, 276, 246, 1.7]]);
E.vis(eyes, [[95.5, 117]]);

/* ---------- props ---------- */
// a rusty key near Baba Valya, gone when they leave
E.placed(E.layers.ui, '<circle cx="0" cy="0" r="8" fill="none" stroke="#9a6b3a" stroke-width="4"/><rect x="6" y="-2" width="26" height="4" fill="#9a6b3a"/><rect x="24" y="2" width="4" height="7" fill="#9a6b3a"/><rect x="30" y="2" width="3" height="5" fill="#9a6b3a"/>', 250, 252, 1.4, 5.5, 11.5);
// the box from the cage, its contents and the cassette
const box = E.G(E.layers.actors); E.raw(box, '<rect x="-34" y="-48" width="68" height="48" fill="#8a6a44" stroke="#1a120a" stroke-width="3"/><rect x="-22" y="-34" width="44" height="22" fill="#e8dcc0" stroke="#111" stroke-width="1.5"/><text x="0" y="-19" text-anchor="middle" font-size="10" font-weight="900" fill="#111">НИНА · 47</text>');
E.move(box, [[0, 202, 338, 1], [72.4, 202, 338, 1], [74, 112, 338, 1.35], [117, 112, 338, 1.35]]); E.vis(box, [[72.5, 117]]);
E.placed(E.layers.ui, '<rect x="-24" y="-20" width="48" height="40" fill="#f4efe0" stroke="#111" stroke-width="2"/><circle cx="-8" cy="-4" r="6" fill="#fff" stroke="#111" stroke-width="1.5"/><circle cx="9" cy="-6" r="5" fill="#3a2414" stroke="#111" stroke-width="1.5"/><rect x="-14" y="2" width="12" height="14" fill="#fff" stroke="#111"/><rect x="3" y="0" width="12" height="16" fill="#c0392b" stroke="#111"/>', 78, 246, 1.6, 76.5, 86.5);
const cassW = E.G(E.layers.ui);
E.move(cassW, [[0, 128, 246, 2.2], [86.4, 128, 246, 2.2], [88.0, 140, 262, 1.0], [117, 140, 262, 1.0]]);
E.pop(E.cassette(cassW), 78.5, 88.4);
// a faint blue light from the "switched off" phone
const glowPhone = E.G(E.layers.ui); E.raw(glowPhone, '<ellipse cx="0" cy="0" rx="70" ry="60" fill="url(#blueglow)"/>');
E.move(glowPhone, [[0, 60, 262, 1], [117, 60, 262, 1]]); E.vis(glowPhone, [[109.2, 117]]);
// phone close-up
E.placed(E.layers.ui, '<rect x="-62" y="-118" width="124" height="236" rx="20" fill="#05070a" stroke="#666" stroke-width="3"/><rect x="-54" y="-106" width="108" height="212" rx="12" fill="#0d1520"/><text x="0" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="#e8f4ff">Нашла.</text>', 180, 214, 1, 112.4, 117);

/* ---------- text, effects ---------- */
E.card(0, 4.6, [{ text: 'СООБЩЕНИЕ ОТ МАМЫ', size: 24, y: 252 }, { text: 'СЕРИЯ 5', size: 52, y: 318, color: '#e03131' }, { text: 'страшная история', size: 15, y: 362, color: '#94a3b8', weight: 400 }]);
E.card(116.6, 122, [{ text: 'КОНЕЦ 5 СЕРИИ', size: 26, y: 310, color: '#e03131' }, { text: 'продолжение следует…', size: 15, y: 348, color: '#94a3b8', weight: 400 }], '#000');
[24.5, 31.5, 39.0, 62.0].forEach(t => E.cut(t, .3));

E.tag(4.6, 14.2, 'Квартира 44. Ночь.');
E.tag(14.6, 19.8, 'Телефоны выключены');
E.tag(24.8, 31, '5 этаж');
E.tag(31.8, 38.5, '3 этаж');
E.tag(39.3, 62, '2 этаж. Не дышать.');
E.tag(62.4, 90, 'Подвал');
E.tag(90.4, 117, 'Темно');
E.bubble(80.2, 86.4, { x: 112, y: 176, w: 150, tx: 146, lines: [{ text: 'Для дочки.' }, { text: 'Последнее.', color: '#c01818' }] });
E.bubble(100.0, 105.6, { x: 178, y: 118, w: 112, tx: 276, red: true, lines: [{ text: '— Лиза?' }] });
E.bubble(105.8, 110, { x: 60, y: 130, w: 110, tx: 92, lines: [{ text: 'Не отвечай.' }] });

E.dim([[0, 0], [39, 0], [46, .25], [61.9, .45], [62, 0], [89.9, 0], [90.2, .8], [117, .88]]);
E.vignette([[0, 0], [24, 0], [25, .3], [45, .6], [61.9, .8], [62, .3], [89.9, .3], [90.2, .9], [117, 1]]);

window.TOTAL = E.TOTAL;
window.seek = t => document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
</script>
</body>
</html>
